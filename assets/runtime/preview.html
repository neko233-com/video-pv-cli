<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>web2video preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0b0e;color:#e9e9ed;font:14px system-ui}header{padding:18px 4vw;display:flex;align-items:center;gap:18px;border-bottom:1px solid #26282e}header strong{letter-spacing:-.03em;font-size:20px}header span{color:#9298a5}main{padding:24px 4vw}.viewport{width:min(100%,calc((100vh - 160px) * __WIDTH__ / __HEIGHT__));margin:auto;aspect-ratio:__WIDTH__/__HEIGHT__;background:#000;position:relative;overflow:hidden}iframe{position:absolute;border:0;width:__WIDTH__px;height:__HEIGHT__px;transform-origin:0 0}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:18px 0}button,input{font:inherit;border:1px solid #4c515e;border-radius:5px;padding:8px 12px;background:#161a22;color:#fff}button{cursor:pointer}input[type=range]{flex:1;min-width:160px;padding:0}input[type=number]{width:88px}#error{color:#ffb2b2;white-space:pre-wrap}#backend{margin-left:auto;color:#a9b1c1}
</style></head><body><header><strong>web2video</strong><span>Preview</span><span id="backend">Loading…</span></header><main><div class="viewport"><iframe id="film" title="HyperFrames composition" src="/__web2video/composition"></iframe></div><div class="controls"><button id="play" disabled>Play</button><input id="scrub" type="range" aria-label="Timeline" min="0" max="12" step="0.033333" value="0"><output id="time">0.00 / 0.00 s</output><label>Time <input id="seek" aria-label="Time in seconds" type="number" min="0" step="0.1" value="1"></label><button id="go">Seek</button><label><input id="loop" type="checkbox"> Loop</label></div><p id="error" role="alert"></p></main><script>
const film=document.getElementById('film'),play=document.getElementById('play'),scrub=document.getElementById('scrub'),time=document.getElementById('time'),error=document.getElementById('error'),backend=document.getElementById('backend');
new ResizeObserver(([entry])=>{film.style.transform=`scale(${entry.contentRect.width/__WIDTH__})`;}).observe(document.querySelector('.viewport'));
let ready=false,busy=false;
function api(){return film.contentWindow.__player;}
play.onclick=()=>{const h=api();if(h.isPlaying())h.pause();else h.play();};
async function seek(value){if(!ready||busy)return;busy=true;try{api().seek(Math.max(0,Math.min(api().getDuration(),Number(value))));await film.contentWindow.__hfWaitForSeekCompletion();}catch(e){error.textContent=e.message;}finally{busy=false;}}
scrub.oninput=()=>seek(scrub.value);document.getElementById('go').onclick=()=>seek(document.getElementById('seek').value);
function tick(){const w=film.contentWindow,h=w.__player;if(h&&w.__renderReady){if(!ready){ready=true;play.disabled=false;scrub.max=h.getDuration();seek(0);}const t=h.getTime(),d=h.getDuration();scrub.value=t;time.textContent=`${t.toFixed(2)} / ${d.toFixed(2)} s`;play.textContent=h.isPlaying()?'Pause':'Play';const gpu=w.__web2videoGPU;backend.textContent=gpu?`WebGPU · ${gpu.vendor||'hardware'} ${gpu.architecture||''}`:'HyperFrames';if(document.getElementById('loop').checked&&!h.isPlaying()&&t>=d-.04){h.seek(0);h.play();}}if(w.__web2videoError||w.__hfStartupError)error.textContent=w.__web2videoError||w.__hfStartupError;requestAnimationFrame(tick);}tick();
</script></body></html>
