name: Validate video-pv-cli and shader export

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./*.go)"
      - name: Test CLI
        run: go test -count=1 -race ./...
      - name: Vet CLI
        run: go vet ./...
      - name: Validate sample project manifest
        run: go run . check --manifest examples/pv-project.json
      - name: Pack skill
        run: go run . skill pack --out dist/pv-production.zip
      - name: Build CLI
        shell: bash
        run: go build -trimpath -o dist/video-pv-cli${{ runner.os == 'Windows' && '.exe' || '' }} .
      - uses: actions/upload-artifact@v7
        with:
          name: cli-and-skill-${{ runner.os }}
          path: dist/

  shader-mp4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        type: [game, character]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Prepare FFmpeg user cache on Windows
        if: runner.os == 'Windows'
        run: go run . check --install-tools
      - name: Initialize original shader project
        run: go run . init --dir work/ci-shader --type ${{ matrix.type }}
      - name: Install locked renderer
        run: go run . setup --project work/ci-shader --skip-browser
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: node work/ci-shader/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: node work/ci-shader/node_modules/playwright/cli.js install chromium
      - name: Exercise real shader export and negative gates
        env:
          PV_INTEGRATION_PROJECT: work/ci-shader
        run: go test -v -count=1 -timeout 12m -run TestIntegrationShaderMP4AndFailureGates .
      - name: Preserve video and QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shader-evidence-${{ runner.os }}-${{ matrix.type }}
          path: |
            work/ci-shader/qa/
            work/ci-shader/renders/
            work/ci-shader/deliverables/

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
