<!doctype html><html lang="en"><meta charset="utf-8"><title>Data-driven PV composition</title>
<link rel="stylesheet" href="/multiplane/runtime/shot.css">
<style>@font-face{font-family:PVSans;src:url('./manrope.ttf')}@font-face{font-family:PVDisplay;src:url('./cinzel.ttf')}#stage{width:1920px;height:1080px;overflow:hidden;background:#08090d}canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<div id="stage"><canvas id="sky"></canvas></div>
<script src="/multiplane/runtime/shot.js"></script>
<script type="module">
import {createCatalogPlayer} from './catalog-runtime.js';
let player;const meta={kind:'data-driven-pv'};
Shot.define({get duration(){return player?.duration||1;},fps:30,fonts:[['500 100px PVSans'],['500 100px PVDisplay']],
 setup:async()=>{player=await createCatalogPlayer(document.getElementById('sky'));window.SHOT.fps=player.fps;Object.assign(meta,player.meta);},
 get cuts(){return player?.cuts||[];},render(t){if(player)player.render(t);},meta,post:{motionBlur:1,grain:0}});
</script></html>
