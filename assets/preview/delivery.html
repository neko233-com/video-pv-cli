<style>#pvAudit{position:fixed;top:12px;right:12px;z-index:9999;background:#111316ed;padding:16px;border:1px solid #465064;max-width:460px}#pvAudit h2{font-size:18px;margin:0 0 12px}#pvAudit button{padding:10px;font:inherit}#pvAudit pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}</style>
<aside id="pvAudit"><h2>PV 网站背景验证</h2><button id="run" disabled>验证自动播放与两次循环</button><pre id="status" role="status">正在加载视频。</pre></aside>
<script type="module">
const status=document.getElementById('status'),button=document.getElementById('run');
function ready(){const v=document.querySelector('video');if(!v)return;if(v.readyState<2){v.addEventListener('loadeddata',ready,{once:true});return;}button.disabled=false;status.textContent='准备就绪。请保持此标签可见约 15 秒。';}ready();
button.onclick=async()=>{button.disabled=true;const doc=document,v=doc.querySelector('video'),checks={},started=performance.now();let last=v.currentTime,loops=0,observations=0,playing=false;
await new Promise(resolve=>{const tick=()=>{const t=v.currentTime;if(!v.paused&&t!==last)playing=true;if(t<last-1)loops++;last=t;observations++;status.textContent=`正在观察：${t.toFixed(2)} / ${v.duration.toFixed(2)} 秒；已循环 ${loops} 次`;
if(loops>=2||performance.now()-started>35000){resolve();return;}requestAnimationFrame(tick);};tick();});
checks.autoplay=v.autoplay&&playing;checks.loop=v.loop&&loops>=2;checks.muted=v.muted&&v.defaultMuted;checks.no_controls=!v.controls;checks.no_pointer=getComputedStyle(v).pointerEvents==='none';checks.no_focus=v.tabIndex===-1&&v.parentElement.inert;checks.inline=v.playsInline;checks.poster=doc.querySelector('.background img').complete&&doc.querySelector('.background img').naturalWidth>0;checks.decode=!v.error&&v.readyState>=2;const link=doc.querySelector('a'),rect=link.getBoundingClientRect();checks.foreground_hit=doc.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2)?.closest('a')===link;
const report={schema:'video-pv-cli/website-background-verification/1',passed:Object.values(checks).every(Boolean),browser:navigator.userAgent,loops,observations,duration:v.duration,elapsed_ms:Math.round(performance.now()-started),checks};
const saved=await(await fetch('/api/background-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)})).json();status.textContent=`${report.passed?'通过':'未通过'} · ${loops} 次真实播放循环 · ${saved.saved}\n${JSON.stringify(checks,null,2)}`;button.disabled=false;};
</script>
