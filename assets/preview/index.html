<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV · WebGPU 验证台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#111316;color:#eceef1}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;border-bottom:1px solid #30343c;display:flex;justify-content:space-between;align-items:baseline}h1{font-size:24px;margin:0;font-weight:600}header p{color:#a8aeb9;margin:0}main{max-width:1480px;margin:auto;padding:24px 32px}.toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{font-size:13px;color:#a8aeb9;display:grid;gap:7px}select,input,button{font:inherit;border:1px solid #414751;border-radius:6px;color:#eceef1;background:#1d2128;padding:10px 12px}select{max-width:490px}button{cursor:pointer}button:hover{background:#2a303a}button.primary{background:#dce7ff;color:#162844;border-color:#dce7ff}button:disabled{opacity:.45;cursor:wait}.stage{margin-top:22px;background:#050609;aspect-ratio:16/9;border:1px solid #30343c}iframe{width:100%;height:100%;border:0;display:block}.transport{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}.transport input{width:110px}#seek{flex:1;min-width:140px;accent-color:#bfd4ff;padding:0}.info{display:flex;gap:28px;color:#b8c0ce;font-size:13px;margin:16px 0}.checks{border-top:1px solid #30343c;padding-top:22px;margin-top:24px}.checks h2{font-size:18px;font-weight:500;margin:0 0 14px}.checks p{font-size:14px;color:#a8aeb9;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap}progress{width:100%;height:6px;accent-color:#bfd4ff;margin:18px 0}#status{font-size:15px;white-space:pre-wrap}#log{font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;color:#aab7c9;max-height:200px;overflow:auto}#error{color:#ffb1b1}footer{font-size:12px;color:#8d96a7;padding-top:20px}@media(max-width:700px){header,main{padding:18px}header{display:block}header p{margin-top:8px}select{max-width:100%;width:100%}.toolbar label{width:100%}.info{display:block}.transport button{padding:9px}.stage{margin-top:16px}}
</style>
<header><h1>PV · WebGPU 验证台</h1><p id="catalogCount">正在读取目录</p></header>
<main><div class="toolbar"><label>预览类型<select id="mode" aria-label="预览类型"><option value="style">风格</option><option value="template">模板</option><option value="transition">转场</option></select></label><label>选择风格<select id="style" aria-label="选择风格"></select></label><label>选择模板<select id="template" aria-label="选择模板"></select></label><label>选择转场<select id="transition" aria-label="选择转场"></select></label></div>
<div class="stage"><iframe id="frame" title="PV 预览"></iframe></div>
<div class="transport"><button id="start">起点</button><button id="middle">中点</button><button id="end">终点</button><input id="seek" type="range" aria-label="时间轴" min="0" max="1" step=".001" value="0"><label>秒<input id="time" type="number" aria-label="定位秒数" min="0" step=".033333333" value="0"></label><button id="go">定位</button><button id="play">播放</button><button id="poster">保存当前画面</button></div>
<div class="info"><span id="gpu">等待 WebGPU</span><span id="profile">等待画面</span></div><div id="error" role="alert"></div>
<section class="checks"><h2>Edge 本机验证</h2><p>遍历全部预设，检查实际 WebGPU 后端、画面像素和跳转回起点的一致性。浏览器检查与 Windows MP4 导出检查分别记录。再次运行会替换本目录的结果，不产生新的历史目录。</p><div class="actions"><button id="all" class="primary">验证全部风格、模板与转场</button><button id="one">验证当前预设</button><button id="cancel">停止批量验证</button></div><progress id="progress" max="1368" value="0"></progress><div id="status" role="status">准备就绪</div><pre id="log"></pre></section><footer>动画画面来自项目的原生 WebGPU / WGSL；代码、素材权利与最终审片需要分别确认。</footer></main>
<script type="module">
const $=id=>document.getElementById(id),catalog=await(await fetch('/api/catalog')).json();
for(const [key,items] of [['style',catalog.styles],['template',catalog.templates],['transition',catalog.transitions]])for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.id+' · '+item.name;$(key).append(option);}
$('template').value='website-atmosphere-midnight';$('transition').value='crossfade';
let shot,current,duration=1,playing=false,busy=false,cancel=false,playToken=0,lastTime=0,requestedTime=0,lastPixels;
let renderQueue=Promise.resolve();function controls(enabled){for(const element of document.querySelectorAll('.toolbar select,.transport button,.transport input,#all,#one'))element.disabled=!enabled;}const rows=[];const browserCases=await(await fetch('/api/browser-cases')).json();$('catalogCount').textContent=`${catalog.styles.length} 个风格 / ${catalog.templates.length} 套模板 / ${catalog.transitions.length} 套转场`;$('progress').max=browserCases.length;
function errors(message){$('error').textContent=message||'';}
async function load(kind,id){controls(false);$('profile').textContent='正在加载画面';await renderQueue;playing=false;playToken++;$('play').textContent='播放';errors('');current={kind,id};if(kind!=='atlas'){$('mode').value=kind;$(kind).value=id;}
 $('frame').contentWindow?.__PV_WEBGPU_DISPOSE?.();shot=null;lastPixels=null;
 await new Promise((resolve,reject)=>{const frame=$('frame');frame.onload=async()=>{try{const win=frame.contentWindow;await win.SHOT.ready;await win.__PV_WEBGPU_FLUSH();shot=win.SHOT;duration=shot.duration;const gpu=shot.meta.gpu;if(gpu.backend!=='webgpu'||gpu.shaderLanguage!=='wgsl')throw Error('没有有效的 WebGPU / WGSL 后端');$('gpu').textContent=`WebGPU · ${gpu.vendor||'adapter'} · ${gpu.architecture||'native'}`;$('seek').max=String(duration);$('time').max=String(duration);await show(0);$('profile').textContent=`${shot.fps} fps · ${duration.toFixed(2)} 秒`;controls(!busy);resolve();}catch(error){controls(!busy);errors(error.message);reject(error);}};frame.src=`/${kind}/${encodeURIComponent(id)}/pv.html?t=0`;});
}
function show(t){requestedTime=Math.max(0,Math.min(duration,t));const next=renderQueue.then(()=>drawFrame(t));renderQueue=next.catch(()=>{});return next;}async function drawFrame(t){if(!shot)return;t=Math.max(0,Math.min(duration,t));shot.render(t);const win=$('frame').contentWindow,device=win.__PV_WEBGPU_DEVICE,canvas=win.document.getElementById('sky'),texture=canvas.getContext('webgpu').getCurrentTexture(),stride=Math.ceil(canvas.width*4/256)*256;
 const buffer=device.createBuffer({size:stride*canvas.height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const encoder=device.createCommandEncoder();encoder.copyTextureToBuffer({texture},{buffer,bytesPerRow:stride,rowsPerImage:canvas.height},[canvas.width,canvas.height]);device.queue.submit([encoder.finish()]);
 try{await buffer.mapAsync(GPUMapMode.READ);const raw=new Uint8Array(buffer.getMappedRange()),rgba=new Uint8ClampedArray(canvas.width*canvas.height*4),bgra=navigator.gpu.getPreferredCanvasFormat().startsWith('bgra');for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){const src=y*stride+x*4,dst=(y*canvas.width+x)*4;rgba[dst]=raw[src+(bgra?2:0)];rgba[dst+1]=raw[src+1];rgba[dst+2]=raw[src+(bgra?0:2)];rgba[dst+3]=raw[src+3];}lastPixels={width:canvas.width,height:canvas.height,data:rgba};}finally{buffer.unmap();buffer.destroy();}
 await win.__PV_WEBGPU_FLUSH();lastTime=t;$('time').value=t.toFixed(4);$('seek').value=String(t);}
async function pixels(){const {width,height,data}=lastPixels,rgba=new Uint8Array(64*36*4);for(let y=0;y<36;y++)for(let x=0;x<64;x++){const src=(Math.floor(y*height/36)*width+Math.floor(x*width/64))*4;rgba.set(data.subarray(src,src+4),(y*64+x)*4);}let sum=0,sq=0;for(let i=0;i<rgba.length;i+=4){const v=.2126*rgba[i]+.7152*rgba[i+1]+.0722*rgba[i+2];sum+=v;sq+=v*v;}const n=rgba.length/4;const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',rgba))).map(v=>v.toString(16).padStart(2,'0')).join('');return {sha256:hash,luma_stddev:Math.sqrt(Math.max(0,sq/n-(sum/n)**2))};}
async function check(kind,id){await load(kind,id);const times=kind==='transition'?[0,1.6,1.9,2.2,duration-1/shot.fps]:[0,duration/2,duration-1/shot.fps];let first;
 const metadata=await(await fetch('/api/browser-cases')).json();for(const t of [...times,0]){if(cancel)throw Error('用户停止');await show(t);const p=await pixels();if(!first)first=p.sha256;const allowUniform=metadata.some(c=>c.kind===kind&&c.id===id&&Math.abs(c.time-t)<1e-6&&c.allow_uniform);const row={kind,id,time:t,allow_uniform:allowUniform,...p};if(kind!=='transition'&&!allowUniform&&p.luma_stddev<.2)throw Error(`空白画面：${id}`);if(t===0&&first!==p.sha256)throw Error(`时间跳转不一致：${id}`);rows.push(row);$('progress').value=rows.length;$('status').textContent=`已检查 ${rows.length} 个帧案例 · ${kind==='template'?'模板':'转场'} ${id}`;$('log').textContent=rows.slice(-5).map(r=>`${r.kind} / ${r.id} / ${r.time.toFixed(3)}s / ${r.sha256.slice(0,14)}`).join('\n');}
}
async function run(all){if(busy)return;busy=true;cancel=false;rows.length=0;$('all').disabled=$('one').disabled=true;errors('');let failure='';const started=new Date().toISOString();
 try{if(all){const cases=browserCases,references=new Map();await load('atlas','all');for(const item of cases){if(cancel)throw Error('用户停止');await show(item.frame/30);const p=await pixels(),key=item.kind+'/'+item.id;if(item.kind!=='transition'&&!item.allow_uniform&&p.luma_stddev<.2)throw Error('空白画面：'+key);if(item.repeat){if(references.get(key)!==p.sha256)throw Error('时间跳转不一致：'+key);}else if(!references.has(key))references.set(key,p.sha256);rows.push({...item,...p});$('mode').value=item.kind;$(item.kind).value=item.id;$('progress').value=rows.length;$('status').textContent=`已检查 ${rows.length} 个帧案例 · ${key}`;$('log').textContent=rows.slice(-5).map(r=>`${r.kind} / ${r.id} / ${r.time.toFixed(3)} / ${r.sha256.slice(0,14)}`).join('\n');}}else await check(current.kind,current.id);}catch(error){failure=error.message;errors(failure);}finally{const report={schema:'video-pv-cli/browser-verification/1',source_sha256:catalog.source_sha256,browser:navigator.userAgent,started_at:started,finished_at:new Date().toISOString(),backend:'webgpu',gpu:shot?.meta.gpu||null,full_catalog:all,expected_frames:all?browserCases.length:null,passed:!failure&&(!all||rows.length===browserCases.length),error:failure,results:rows};const saved=await(await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)})).json();$('status').textContent=`${report.passed?'通过':'未通过'} · ${rows.length} 个帧案例 · ${saved.saved}`;busy=false;if(all&&rows.length){const selected=rows.at(-1);await load(selected.kind,selected.id);}controls(true);$('all').disabled=$('one').disabled=false;}
}
$('style').onchange=()=>load('style',$('style').value).catch(e=>errors(e.message));$('template').onchange=()=>load('template',$('template').value).catch(e=>errors(e.message));$('transition').onchange=()=>load('transition',$('transition').value).catch(e=>errors(e.message));$('mode').onchange=()=>load($('mode').value,$($('mode').value).value).catch(e=>errors(e.message));
$('start').onclick=()=>show(0);$('middle').onclick=()=>show(current.kind==='transition'?1.9:duration/2);$('end').onclick=()=>show(duration-1/shot.fps);$('go').onclick=()=>show(Number($('time').value));$('seek').oninput=()=>show(Number($('seek').value));
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';const token=++playToken;if(!playing)return;const start=performance.now()-lastTime*1000;const tick=async()=>{if(!playing||token!==playToken)return;await show(((performance.now()-start)/1000)%duration);requestAnimationFrame(tick);};tick();};
$('poster').onclick=async()=>{await show(requestedTime);const canvas=document.createElement('canvas');canvas.width=lastPixels.width;canvas.height=lastPixels.height;canvas.getContext('2d').putImageData(new ImageData(lastPixels.data,lastPixels.width,lastPixels.height),0,0);const response=await fetch('/api/frame',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({png:canvas.toDataURL('image/png')})});const result=await response.json();$('status').textContent='已保存 '+result.saved;};
$('all').onclick=()=>run(true);$('one').onclick=()=>run(false);$('cancel').onclick=()=>{cancel=true;};
const initialStyle=new URL(location.href).searchParams.get('style');if(initialStyle&&catalog.styles.some(style=>style.id===initialStyle))await load('style',initialStyle);else await load('template',$('template').value);
</script></html>
