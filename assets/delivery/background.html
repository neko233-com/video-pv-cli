<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#080b12;color:#f5f7fc}.hero{position:relative;isolation:isolate;min-height:100svh;display:grid;align-items:center;overflow:hidden}.background{position:absolute;inset:0;z-index:-2;pointer-events:none;user-select:none}.background img,.background video{position:absolute;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}.background video{opacity:0}.background video.playing{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#050912bb,#05091220);z-index:-1;pointer-events:none}.content{width:min(1200px,100%);margin:auto;padding:80px 7vw}.content h1{font-size:clamp(44px,7vw,104px);line-height:1.05;font-weight:550;letter-spacing:-.04em;max-width:1000px;margin:0 0 36px}.content a{display:inline-block;color:inherit;text-decoration:none;border-bottom:1px solid #cad8ed;padding:12px 0;font-size:18px}#details{min-height:50vh;padding:90px 7vw}#details h2{font-size:34px;font-weight:500}@media(prefers-reduced-motion:reduce){.background video{display:none}}
</style>
<section class="hero"><div class="background" aria-hidden="true" inert><img src="poster.png" alt=""><video id="backgroundVideo" src="background.mp4" poster="poster.png" autoplay muted loop playsinline preload="metadata" tabindex="-1" aria-hidden="true" disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback"></video></div><div class="shade"></div><main class="content"><h1>{{TITLE}}</h1><a href="#details">探索更多</a></main></section><section id="details"><h2>新的故事，由此展开。</h2></section>
<script>
const video=document.getElementById('backgroundVideo'),motion=matchMedia('(prefers-reduced-motion: reduce)');video.muted=true;video.defaultMuted=true;video.controls=false;
async function sync(){if(motion.matches||document.hidden){video.pause();if(motion.matches)video.classList.remove('playing');return;}try{await video.play();}catch{video.classList.remove('playing');}}
video.addEventListener('playing',()=>video.classList.add('playing'));video.addEventListener('error',()=>video.classList.remove('playing'));document.addEventListener('visibilitychange',sync);motion.addEventListener('change',sync);sync();
</script></html>
